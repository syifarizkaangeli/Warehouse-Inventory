<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda - Warehouse Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <div class="navbar-inner">
        <h2>Warehouse Inventory</h2>

        <nav>
            <a href="beranda.html" class="active">Beranda</a>
            <a href="laporan.html">Laporan</a>
        </nav>
    </div>
</header>

<main class="container">

    <section class="page-header">
        <div>
            <h1>Data Barang</h1>
            <p>Kelola stok barang gudang.</p>
        </div>

        <button class="btn-primary" onclick="openModal()">
            + Tambah Barang
        </button>
    </section>

    <section class="stats">

        <div class="stat-card">
            <span>Total Barang</span>
            <strong id="totalBarang">0</strong>
        </div>

        <div class="stat-card">
            <span>Total Stok</span>
            <strong id="totalStok">0</strong>
        </div>

        <div class="stat-card">
            <span>Nilai Inventaris</span>
            <strong id="totalNilai">Rp0</strong>
        </div>

    </section>

    <section class="card">

        <div class="table-header">
            <h2>Daftar Barang</h2>

            <input
                type="search"
                id="searchInput"
                placeholder="Cari barang..."
            >
        </div>

        <div class="table-wrapper">
            <table>

                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Barang</th>
                        <th>Jumlah</th>
                        <th>Harga / Pcs</th>
                        <th>Total Nilai</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="barangTable">
                    <tr>
                        <td colspan="6" class="loading">
                            Memuat data...
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>

    </section>

</main>

<div id="barangModal" class="modal">

    <div class="modal-box">

        <div class="modal-header">
            <h2 id="modalTitle">Tambah Barang</h2>

            <button
                class="modal-close"
                onclick="closeModal()"
            >
                ×
            </button>
        </div>

        <form id="barangForm">

            <input
                type="hidden"
                id="barangId"
            >

            <div class="form-group">
                <label>Nama Barang</label>

                <input
                    type="text"
                    id="namaBarang"
                    required
                    placeholder="Contoh: Laptop"
                >
            </div>

            <div class="form-group">
                <label>Jumlah</label>

                <input
                    type="number"
                    id="jumlahBarang"
                    min="0"
                    required
                    placeholder="0"
                >
            </div>

            <div class="form-group">
                <label>Harga per Pcs</label>

                <input
                    type="number"
                    id="hargaBarang"
                    min="0"
                    required
                    placeholder="0"
                >
            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="closeModal()"
                >
                    Batal
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Simpan
                </button>

            </div>

        </form>

    </div>

</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>

</body>
</html>
